name: ElAmal-Furniture

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: docker login -u ${{secrets.DOCKER_USERNAME}} -p ${{secrets.DOCKER_PASSWORD}}
      - run: docker build -t website-tests -f projects/website/Dockerfile.dev .
      - run: docker build -t dashboard-tests -f projects/dashboard/Dockerfile.dev .

      - run: docker run -e CI=true website-tests npm run tests
      - run: docker run -e CI=true dashboard-tests npm run test

      - run: docker build -t ElAmal/website -f projects/website/Dockerfile .
      - run: docker build -t ElAmal/dashboard -f projects/dashboard/Dockerfile .
      - run: docker build -t ElAmal/nginx -f nginx/Dockerfile .

      - run: docker push ElAmal/website
      - run: docker push ElAmal/dashboard
      - run: docker push ElAmal/nginx

