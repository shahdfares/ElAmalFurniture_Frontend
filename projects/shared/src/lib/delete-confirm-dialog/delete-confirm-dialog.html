<div class="backdrop" (click)="onBackdropClick()">
  <div class="dcd-modal" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">

    <div class="modal-body">
      <div class="header">
        <div class="icon-box">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/>
          </svg>
        </div>
        <div>
          <h2>Delete Product?</h2>
          <p>Are you sure you want to delete this product?</p>
        </div>
      </div>

      <div class="product-card">
        @if (imageUrl) {
          <img [src]="imageUrl" [alt]="name" />
        } @else {
          <div class="img-placeholder"></div>
        }
        <span class="product-name">{{ name }}</span>
      </div>

      <div class="note">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
        </svg>
        <span>Active orders referencing this specimen will keep archived snapshot records.</span>
      </div>
    </div>

    <div class="footer">
      <button class="btn btn-cancel" type="button" [disabled]="deleting" (click)="cancelled.emit()">
        Cancel
      </button>
      <button class="btn btn-danger" type="button" [disabled]="deleting" (click)="confirmed.emit()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
        </svg>
        Yes, Delete Product
      </button>
    </div>
  </div>

  @if (deleting) {
    <div class="dcd-toast" (click)="$event.stopPropagation()">
      <span class="spinner"></span>
      <div class="toast-text">
        <span>Deleting product from catalog...</span>
        <div class="bar"><div class="bar-fill"></div></div>
      </div>
    </div>
  }
</div>
