<aside class="sidebar">
  <div class="sidebar__top">
    <!-- Brand -->
    <div class="brand">
      <span class="brand__name">ElAmal</span>
      <span class="brand__sub">Atelier Admin</span>
    </div>

    <!-- Nav -->
    <nav class="nav">
      <a
        *ngFor="let item of navItems"
        class="nav__item"
        [routerLink]="item.route"
        routerLinkActive="nav__item--active"
      >
        <span>{{ item.label }}</span>
      </a>
    </nav>
  </div>

  <!-- Footer -->
  <div class="sidebar__bottom">
    <a class="nav__item" routerLink="/settings" routerLinkActive="nav__item--active">
      <span class="material-symbols-outlined">settings</span>
      <span>Settings</span>
    </a>
    <button class="nav__item nav__item--signout" type="button" (click)="signOut()">
      <span class="material-symbols-outlined">logout</span>
      <span>Sign Out</span>
    </button>
  </div>
</aside>
