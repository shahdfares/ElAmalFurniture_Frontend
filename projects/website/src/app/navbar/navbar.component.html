<nav
  class="navbar furniture-navbar"
  [class.home-navbar]="isHomePage"
>
  <div class="container-fluid navbar-content">

    <!-- Logo -->
    <a class="navbar-brand" routerLink="/home">
      <img
        src="/images/Logo.png"
        alt="ElAmal Furniture"
        class="brand-logo"
      />
    </a>

    <!-- Center Navigation -->
    <ul class="navbar-nav main-nav">

      <li class="nav-item">
        <a class="nav-link" routerLink="/home">Home</a>
      </li>

      <li class="nav-item">
        <a class="nav-link" routerLink="/about">About</a>
      </li>

      <!-- Categories: Hover + Click Dropdown -->
      <li class="nav-item dropdown categories-dropdown"
          [class.open]="categoriesOpen"
          (mouseenter)="openCategories()"
          (mouseleave)="closeCategories()">
        <a
          class="nav-link dropdown-toggle"
          href="#"
          role="button"
          id="categoriesDropdown"
          [attr.aria-expanded]="categoriesOpen"
          (click)="onCategoriesClick($event)"
        >
          Categories
        </a>

        <ul
          class="dropdown-menu categories-menu"
          aria-labelledby="categoriesDropdown"
        >
          <li *ngFor="let c of categories">
            <a
              class="dropdown-item"
              [routerLink]="['/collections', c.slug]"
              routerLinkActive="active"
              (click)="closeCategories()"
            >
              {{ c.name }}
            </a>
          </li>
        </ul>
      </li>

      <li class="nav-item">
        <a class="nav-link" routerLink="/collections">Collections</a>
      </li>

    </ul>

    <!-- Right Actions -->
    <div class="navbar-actions">

      <!-- Language -->
      <button
        class="language-btn"
        type="button"
        (click)="toggleLanguage()"
        [attr.aria-label]="'Switch language to ' + nextLanguage"
      >
        <i class="fa-solid fa-globe"></i>
        <span>{{ nextLanguage }}</span>
      </button>

      <span class="action-divider"></span>

      <!-- Expandable Search -->
      <div
        class="search-container"
        [class.expanded]="showSearch"
      >
        <input
          #searchInput
          type="search"
          class="search-input"
          placeholder="Search..."
          aria-label="Search products"
          [value]="searchTerm"
          (input)="searchTerm = searchInput.value"
          (keydown.enter)="submitSearch()"
        />

        <button
          class="search-toggle"
          type="button"
          (click)="toggleSearch()"
          [attr.aria-label]="showSearch ? 'Close search' : 'Open search'"
          [attr.aria-expanded]="showSearch"
        >
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>

      <!-- Dashboard -->
    <a
    class="dashboard-btn"
    [href]="dashboardUrl"
    target="_blank"
    rel="noopener noreferrer"> Dashboard
    </a>

    </div>
  </div>
</nav>
